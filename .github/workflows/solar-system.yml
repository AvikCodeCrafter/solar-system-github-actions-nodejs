name: Solar System Workflow
on:
    workflow_dispatch: 
    push: 
        branches: 
            - main
            - 'feature/*'
jobs:
    unit-testing:
        name: Unit Testing
        runs-on: ubuntu-latest
        steps:
            - name: Git Checkout
              uses: actions/checkout@v7
            - name: Node JS Install 
              uses: actions/setup-node@v7
              with:
                node-version: 24
            - name: Install Node Dependencies
              run: npm Install 
            - name: Unit Testing 
              run: npm test

