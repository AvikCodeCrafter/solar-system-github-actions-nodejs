name: Solar System Workflow
on:
    workflow_dispatch: 
    push: 
        branches: 
            - main
            - 'feature/*'
env:
    MONGO_URI: 'mongodb+srv://supercluster.d83jj.mongodb.net/superData'
    MONGO_USERNAME: ${{ vars.MONGO_USERNAME }}
    MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD}}          
jobs:
    unit-testing:
        name: Unit Testing
        runs-on: ubuntu-latest
        steps:
            - name: Git Checkout
              uses: actions/checkout@v7
            - name: Node JS Install 
              uses: actions/setup-node@v7
              with:
                node-version: 24
            - name: Install Node Dependencies
              run: npm install 
            - name: Validate MongoDB Environment
              run: |
                echo "MONGO_URI configured: ${MONGO_URI:+yes}"
                echo "MONGO_USERNAME configured: ${MONGO_USERNAME:+yes}"
                echo "MONGO_PASSWORD configured: ${MONGO_PASSWORD:+yes}"  
            - name: Unit Testings
              run: npm test

